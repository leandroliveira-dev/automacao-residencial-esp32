<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa inteligente</title>
<style>
:root{--bg:#e9edf1;--parede:#1b2a3a;--piso:#f7f9fb;--tx:#1b2a3a;--mut:#5b6b7b;--on:#d98b00;--luz:#fff0c2;--ok:#17806d;--err:#c0392b;--trilho:#b9c3cd}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--parede:#8fa3b8;--piso:#18212b;--tx:#e6edf4;--mut:#93a4b5;--on:#f0b13c;--luz:#3a3118;--ok:#3cc0a6;--err:#ff7a6b;--trilho:#3a4856}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{margin:0 0 10px;font-size:1.05rem;font-weight:650}
#conexao{display:block;font-size:.85rem;color:var(--mut)}
#conexao::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--err)}
#conexao.ok::before{background:var(--ok)}
.modo{display:flex;align-items:center;gap:10px;font-weight:600}
#alerta{display:none;margin:0 0 16px;padding:12px 16px;background:#b3261e;color:#fff;font-weight:600}
#alerta.ativo{display:block}
.planta{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:4px solid var(--parede);background:var(--parede)}
.comodo{min-height:180px;padding:16px;background:var(--piso);transition:background .3s}
.comodo.luz{background:var(--luz)}
.comodo.risco{outline:4px solid var(--err);outline-offset:-4px}
.alarme{grid-column:1/-1;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.alarme h2{margin:0}
.num{font-size:2.2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.un{font-size:1rem;font-weight:500;color:var(--mut);margin-left:2px}
.rot{margin:0 0 12px;color:var(--mut);font-size:.9rem}
.linha{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.duplo{display:flex;gap:24px}
.sw{position:relative;flex:none;width:52px;height:30px;padding:0;border:2px solid var(--parede);border-radius:15px;background:var(--trilho);cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;border:2px solid var(--parede);background:var(--piso);transition:transform .15s}
.sw[aria-checked=true]{background:var(--on)}
.sw[aria-checked=true]::after{transform:translateX(22px)}
input[type=range]{width:100%;accent-color:var(--on)}
.botoes{display:flex;gap:8px;margin-top:10px}
.bt{flex:1;padding:8px 12px;border:2px solid var(--parede);border-radius:6px;background:transparent;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.bt:hover{background:var(--trilho)}
.sw:focus-visible,.bt:focus-visible,input:focus-visible{outline:3px solid var(--on);outline-offset:3px}
@media(max-width:520px){.planta{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Casa inteligente</h1><span id="conexao">Conectando...</span></div>
  <div class="modo"><span id="n-auto">Modo automático</span><button class="sw" data-dev="auto" role="switch" aria-checked="false" aria-labelledby="n-auto"></button></div>
</header>

<p id="alerta" role="alert"></p>

<div class="planta">
  <section class="comodo" id="sala">
    <h2>Sala</h2>
    <p class="num"><span id="luz">--</span><span class="un">% de luz</span></p>
    <div class="linha"><span id="n-led">Iluminação</span><button class="sw" data-dev="led" role="switch" aria-checked="false" aria-labelledby="n-led"></button></div>
  </section>

  <section class="comodo" id="cozinha">
    <h2>Cozinha</h2>
    <p class="num"><span id="gas">--</span><span class="un">% de gás</span></p>
    <div class="linha"><span id="n-rele">Exaustor</span><button class="sw" data-dev="rele" role="switch" aria-checked="false" aria-labelledby="n-rele"></button></div>
  </section>

  <section class="comodo" id="quarto">
    <h2>Quarto</h2>
    <div class="duplo">
      <p class="num"><span id="temp">--</span><span class="un">°C</span></p>
      <p class="num"><span id="umid">--</span><span class="un">% umidade</span></p>
    </div>
  </section>

  <section class="comodo" id="garagem">
    <h2>Garagem</h2>
    <p class="rot" id="pir">--</p>
    <label for="servo">Portão: <output id="ang">0°</output></label>
    <input type="range" id="servo" min="0" max="180" step="5" value="0">
    <div class="botoes">
      <button class="bt" data-servo="0">Fechar</button>
      <button class="bt" data-servo="90">Abrir</button>
    </div>
  </section>

  <section class="comodo alarme">
    <h2 id="n-buzzer">Sirene</h2>
    <button class="sw" data-dev="buzzer" role="switch" aria-checked="false" aria-labelledby="n-buzzer"></button>
  </section>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const NOMES = {GAS: 'nível de gás alto na cozinha', TEMP: 'temperatura alta no quarto'};
let arrastando = false;

function render(d) {
  $('luz').textContent = d.luz;
  $('gas').textContent = d.gas;
  $('temp').textContent = Number(d.temp).toFixed(1);
  $('umid').textContent = Math.round(d.umid);
  $('pir').textContent = d.pir ? 'Movimento detectado' : 'Sem movimento';
  document.querySelectorAll('.sw').forEach(b =>
    b.setAttribute('aria-checked', d[b.dataset.dev] ? 'true' : 'false'));
  if (!arrastando) {
    $('servo').value = d.servo;
    $('ang').textContent = d.servo + '°';
  }
  $('sala').classList.toggle('luz', !!d.led);
  const a = d.alerta || '';
  $('alerta').classList.toggle('ativo', !!a);
  $('alerta').textContent = a ? 'Alerta: ' + a.split('+').map(x => NOMES[x] || x).join(' e ') : '';
  $('cozinha').classList.toggle('risco', a.includes('GAS'));
  $('quarto').classList.toggle('risco', a.includes('TEMP'));
}

function online(ok) {
  const c = $('conexao');
  c.className = ok ? 'ok' : '';
  c.textContent = ok ? 'Conectado ao ESP32' : 'Sem conexão com o ESP32';
}

async function chamar(url) {
  try {
    const r = await fetch(url, {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
    online(true);
  } catch (e) {
    online(false);
  }
}

const comando = (dev, val) => chamar('/api/cmd?dev=' + dev + '&val=' + val);

document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () =>
  comando(b.dataset.dev, b.getAttribute('aria-checked') === 'true' ? 0 : 1)));

document.querySelectorAll('[data-servo]').forEach(b => b.addEventListener('click', () =>
  comando('servo', b.dataset.servo)));

$('servo').addEventListener('input', e => {
  arrastando = true;
  $('ang').textContent = e.target.value + '°';
});
$('servo').addEventListener('change', e => {
  arrastando = false;
  comando('servo', e.target.value);
});

chamar('/api/estado');
setInterval(() => chamar('/api/estado'), 1500);
</script>
</body>
</html>
